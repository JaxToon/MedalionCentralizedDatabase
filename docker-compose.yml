# No fixed project name: Compose derives it from the checkout directory, so each
# checkout gets its own containers, network, image tag and database volume.
#
# Every published port binds to 127.0.0.1: nothing in this stack is reachable from
# outside the host. The demo database user is a superuser and the API trusts a
# mock auth header, so neither may ever face a network.

services:
  db:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Host 5433: a native PostgreSQL commonly owns 5432 on the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first boot the entrypoint runs a temporary server that only
      # listens on the unix socket, so a socket probe would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # The only service that builds; frontend runs the same image.
    build: .
    image: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    # Default command (Dockerfile): migrate, then serve on 8000.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    image: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    command: >
      streamlit run frontend/Home.py
      --server.address 0.0.0.0 --server.port 8501
      --server.headless true --browser.gatherUsageStats false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
